server.port=8080
spring.config.import=optional:file:.env[.properties]
spring.main.allow-bean-definition-overriding=true

# ── Tomcat DDoS / Spam Hardening ──────────────────────────────────────────────
# Max simultaneous connections Tomcat will accept (queue the rest, drop when full)
server.tomcat.max-connections=2000
# Max worker threads — tune to (vCPU * 2) + pending_io for your host
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
# Backlog: how many TCP SYN packets queue waiting for accept() — drop beyond this
server.tomcat.accept-count=100
# Drop a connection if the full HTTP request headers are not received within 3 s
server.tomcat.connection-timeout=3000
# Keep-alive: reuse TCP connections but limit how many requests per connection
server.tomcat.keep-alive-timeout=10000
server.tomcat.max-keep-alive-requests=50
# Max size of the HTTP request line + headers (protects against header-flooding)
server.tomcat.max-http-form-post-size=2MB

# ── Redis Cache + Distributed Rate Limiter ────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# Connection pool settings (Lettuce)
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=1000ms
# Server instance identifier (used in logs, useful when running multiple instances)
app.server.instance=${SERVER_INSTANCE:server-1}


# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/digital_store}
spring.datasource.driverClassName=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USERNAME:postgres}

# [Fix-14] DB password fallback
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

