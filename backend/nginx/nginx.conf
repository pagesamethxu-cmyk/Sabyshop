# ════════════════════════════════════════════════════════════════════════════
#  Nginx Load Balancer Configuration
#  Architecture: Client → Nginx → Spring Boot (x3) → Redis → PostgreSQL
# ════════════════════════════════════════════════════════════════════════════

# ── Worker settings ──────────────────────────────────────────────────────────
worker_processes auto;                   # Use all CPU cores
worker_rlimit_nofile 65535;             # Max open files per worker

events {
    worker_connections 4096;             # Max connections per worker
    use epoll;                           # Linux high-performance event model
    multi_accept on;                     # Accept multiple connections at once
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  30;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens      off;              # Hide Nginx version (security)

    # ── Gzip Compression ─────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/xml application/json
                    application/javascript application/xml+rss
                    application/atom+xml image/svg+xml;

    # ── DDoS / Spam Protection at Nginx Level ────────────────────────────────
    # Rate limit zone: 10MB stores ~160,000 IP entries
    limit_req_zone  $binary_remote_addr zone=global:10m  rate=60r/m;
    limit_req_zone  $binary_remote_addr zone=auth:10m    rate=5r/m;
    limit_req_zone  $binary_remote_addr zone=api:10m     rate=80r/m;

    # Connection limit per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Upstream: 3 Spring Boot instances ────────────────────────────────────
    upstream spring_backend {
        # least_conn = send new request to server with FEWEST active connections
        least_conn;

        server spring-app-1:8080 weight=1 max_fails=3 fail_timeout=30s;
        server spring-app-2:8080 weight=1 max_fails=3 fail_timeout=30s;
        server spring-app-3:8080 weight=1 max_fails=3 fail_timeout=30s;

        # Keep alive connections to backend (reduces TCP handshake overhead)
        keepalive 32;
    }

    # ── Block bad bots / scanners ─────────────────────────────────────────────
    map $http_user_agent $bad_bot {
        default         0;
        ~*sqlmap        1;
        ~*nikto         1;
        ~*nmap          1;
        ~*masscan       1;
        ~*zgrab         1;
        ~*dirbuster     1;
        ~*gobuster      1;
        ~*burpsuite     1;
        ~*acunetix      1;
        ~*nessus        1;
    }

    # ── Main Server Block ─────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;                   # Accept any hostname (change to your domain)

        # Security headers
        add_header X-Frame-Options        "SAMEORIGIN"            always;
        add_header X-Content-Type-Options "nosniff"               always;
        add_header X-XSS-Protection       "1; mode=block"         always;
        add_header Referrer-Policy        "strict-origin"         always;
        add_header X-Load-Balanced-By     "nginx"                 always;

        # Block bots identified in map above
        if ($bad_bot = 1) {
            return 403 '{"success":false,"message":"Access denied","data":null}';
        }

        # Limit connections per IP (max 20 simultaneous connections)
        limit_conn conn_limit 20;

        # Max request body size (matches Spring multipart limit)
        client_max_body_size 11M;
        client_body_timeout  10s;
        client_header_timeout 10s;

        # ── Auth endpoints — strict rate limit ───────────────────────────────
        location /api/auth/ {
            limit_req zone=auth burst=3 nodelay;
            limit_req_status 429;

            proxy_pass         http://spring_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }

        # ── All other API endpoints ───────────────────────────────────────────
        location /api/ {
            limit_req zone=global burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         http://spring_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;

            # Cache static GET responses at Nginx level
            proxy_cache_valid 200 1m;
        }

        # ── Health check endpoint (Nginx itself) ─────────────────────────────
        location /nginx-health {
            access_log off;
            return 200 '{"status":"ok","layer":"nginx"}';
            add_header Content-Type application/json;
        }

        # ── Block common attack paths ─────────────────────────────────────────
        location ~* (\.env|\.git|\.htaccess|wp-admin|phpmyadmin) {
            return 404;
        }

        # ── Custom error pages ────────────────────────────────────────────────
        error_page 429 @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"success":false,"message":"Too many requests. Please slow down.","data":null}';
        }

        error_page 502 503 504 @backend_down;
        location @backend_down {
            default_type application/json;
            return 503 '{"success":false,"message":"Service temporarily unavailable. Please try again.","data":null}';
        }
    }
}
